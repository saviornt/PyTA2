[package]
name = "pyta-engine"
description = "Asynchronous calculation engine for PyTA indicators"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
pyta-core = { path = "../pyta-core" }
pyta-momentum = { path = "../pyta-momentum" }
