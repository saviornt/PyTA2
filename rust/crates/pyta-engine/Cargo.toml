[package]
name = "pyta-engine"
description = "Calculation engine for PyTA indicators: dispatch, planner and batch execution"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
# The library has no benchmarks; without this, `cargo bench` runs its unit-test
# harness, which rejects Criterion flags such as `--noplot`.
bench = false

[dependencies]
pyta-common = { path = "../pyta-common" }
pyta-core = { path = "../pyta-core" }
pyta-momentum = { path = "../pyta-momentum" }
pyta-trend = { path = "../pyta-trend" }
log = { workspace = true }
tokio = { workspace = true }
rayon = { workspace = true }

[[bench]]
name = "single_call"
harness = false

[[bench]]
name = "workloads"
harness = false

[dev-dependencies]
criterion = "0.8.2"
env_logger = { workspace = true }

[lints]
workspace = true
