# cargo-deny configuration: licenses and security advisories.
# Run with `cargo deny check licenses advisories` (CI job "cargo deny").

[graph]
all-features = true

[advisories]
# RustSec advisory database; unmaintained and yanked crates are reported too.
yanked = "deny"

[licenses]
# Permissive licenses used by PyTA's dependency tree. Add one only after
# checking it is compatible with PyTA's MIT license.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "MIT",
    "Unicode-3.0",
]
confidence-threshold = 0.9

